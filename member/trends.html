<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trends — oatinvestor</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .trends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
      align-items: start;
    }
    .trend-card-wrap { text-decoration: none; display: block; color: inherit; }
    .ticker-pill.action-buy   { background: var(--green-bg);   color: var(--green-text);  border-color: transparent; }
    .ticker-pill.action-watch { background: var(--amber-bg);   color: var(--amber-text);  border-color: transparent; }
    .ticker-pill.action-hold  { background: var(--blue-bg);    color: var(--blue-text);   border-color: transparent; }
    .ticker-pill.action-study { background: var(--bg-surface); color: var(--text-3);      border-color: var(--border); }
    .ticker-pill.action-sell  { background: var(--red-bg);     color: var(--red-text);    border-color: transparent; }
    @media (max-width: 600px) { .trends-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><span class="logo-dot"></span>oatinvestor</a>
    <div class="nav-links">
      <a href="../index.html">หน้าแรก</a>
      <a href="../portfolio.html">พอร์ตโฟลิโอ</a>
      <a href="stocks.html">Watchlist</a>
      <a href="trends.html" class="active">Trends</a>
      <a href="theme.html">Theme</a>
      <a href="../team.html">About</a>
    </div>
    <div class="nav-actions">
      <button class="theme-btn" id="theme-btn">🌙</button>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:40px;padding-bottom:80px">

  <!-- Header -->
  <div style="margin-bottom:28px">
    <div class="section-label">Mega Trends</div>
    <h1 style="font-size:1.8rem;margin-bottom:8px">Trends ที่ขับเคลื่อนตลาด</h1>
    <p style="font-size:.9rem">วิเคราะห์ <span id="trend-count">—</span> Mega Trends พร้อม Conviction และหุ้นที่ได้ประโยชน์</p>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" data-conv="all">ทั้งหมด</button>
    <button class="filter-btn" data-conv="high">HIGH</button>
    <button class="filter-btn" data-conv="med">MEDIUM</button>
  </div>

  <!-- Trends Grid -->
  <div class="trends-grid" id="trends-grid">
    <div style="grid-column:1/-1;text-align:center;padding:48px 0;color:var(--text-3)">กำลังโหลด...</div>
  </div>

</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">oatinvestor</div>
    <div class="footer-links">
      <a href="../index.html">หน้าแรก</a>
      <a href="../portfolio.html">พอร์ตโฟลิโอ</a>
    </div>
  </div>
  <div class="footer-copy">© 2026 oatinvestor · ข้อมูลเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน</div>
</footer>

<script src="../trends.js"></script>
<script src="../app.js"></script>
<script>
let activeConv = 'all';
let stockActions = {};

const CONV_CLS = { HIGH: 'badge-high', MED: 'badge-medium', MEDIUM: 'badge-medium', LOW: 'badge-low' };
const CONV_TAG_STYLE = {
  HIGH:   'color:var(--green-text)',
  MED:    'color:var(--yellow-text)',
  MEDIUM: 'color:var(--yellow-text)',
  LOW:    'color:var(--text-3)',
};

function convLabel(c) {
  const label = c === 'MED' ? 'MEDIUM' : c;
  return `<span class="badge ${CONV_CLS[c] || 'badge-medium'}">${label}</span>`;
}

function renderTrends() {
  if (typeof TRENDS_DATA === 'undefined') return;
  const grid = document.getElementById('trends-grid');
  const filtered = TRENDS_DATA.filter(t => {
    if (activeConv === 'all') return true;
    return (t.conviction||'').toUpperCase() === activeConv.toUpperCase();
  });

  document.getElementById('trend-count').textContent = TRENDS_DATA.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text-3)">ไม่มี Trend ที่ตรงเงื่อนไข</div>';
    return;
  }

  grid.innerHTML = filtered.map((t) => `
    <a href="trend.html?tag=${encodeURIComponent(t.tag)}" class="trend-card-wrap">
      <div class="trend-card">
        <div class="trend-card-header">
          <div class="trend-card-header-left">
            <div class="trend-tag" style="${CONV_TAG_STYLE[t.conviction] || ''}">${t.tag || ''}</div>
            <div class="trend-title">${t.title || ''}</div>
            <div class="trend-subtitle">${t.subtitle || ''}</div>
          </div>
        </div>
        <div class="trend-card-meta">
          ${convLabel(t.conviction || '')}
          <span class="trend-date">อัพเดท ${t.last_updated || ''}</span>
        </div>
        ${t.summary ? `<p style="font-size:.86rem;color:var(--text-2);line-height:1.65;margin:10px 0 0">${t.summary}</p>` : ''}
        ${t.tickers && t.tickers.length ? `
        <div class="ticker-strip" style="margin-top:10px">
          ${t.tickers.map(tk => { const a = stockActions[tk]; return `<span class="ticker-pill${a ? ' action-'+a : ''}">${tk}</span>`; }).join('')}
        </div>` : ''}
      </div>
    </a>
  `).join('');
}

// Filters
document.querySelectorAll('.filter-btn[data-conv]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-conv]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeConv = btn.dataset.conv;
    renderTrends();
  });
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const resp = await fetch('../data/stocks.json');
    const raw = await resp.json();
    Object.entries(raw).forEach(([sym, s]) => {
      if (s.action) stockActions[sym] = s.action.toLowerCase();
    });
  } catch (_) {}
  renderTrends();
});
</script>
</body>
</html>
