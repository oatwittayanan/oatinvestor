<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock — oatinvestor</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .85rem; color: var(--text-3); margin-bottom: 24px;
      transition: color var(--ease);
    }
    .back-link:hover { color: var(--text); }
    .stock-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
    }
    .stock-header-left h1 { font-size: 2rem; margin-bottom: 4px; }
    .stock-header-left .company-name { font-size: 1rem; color: var(--text-2); margin-bottom: 10px; font-family: var(--font-sans); }
    .price-big { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; }
    .section-block { margin-bottom: 28px; }
    .section-block-title {
      font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-block-title::after { content:''; flex:1; height:1px; background:var(--border-soft); }
    .idea-box {
      background: var(--yellow-dim); border: 1px solid rgba(255, 233, 77,.3);
      border-radius: var(--r-lg); padding: 18px 20px;
    }
    .idea-box p { font-size: .9rem; color: var(--text); font-style: italic; line-height: 1.6; }

    /* Analyst cards shared */
    .analyst-card { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); }
    .analyst-header {
      display: flex; align-items: center; gap: 10px; padding: 13px 18px;
      border-bottom: 1px solid var(--border-soft);
    }
    .analyst-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 800; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    img.analyst-avatar { display: block; }
    .analyst-header h4 { font-size: .88rem; font-weight: 700; margin: 0; }
    .analyst-header .analyst-role { font-size: .72rem; color: var(--text-3); margin-left: auto; }

    /* Mark card */
    .mark-card .analyst-header { background: rgba(255, 233, 77,.1); }
    .mark-avatar { background: var(--yellow); color: #7A5C00; }

    /* Warren card */
    .warren-card .analyst-header { background: rgba(59,130,246,.07); }
    .warren-avatar { background: #3B82F6; color: #fff; }

    /* Charlie card */
    .charlie-easy-card .analyst-header { background: rgba(107,114,128,.07); }
    .charlie-e-avatar { background: var(--text-3); color: var(--bg-base); }

    /* Mark full body */
    .mark-section { padding: 14px 18px; border-bottom: 1px solid var(--border-soft); }
    .mark-section:last-child { border-bottom: none; }
    .mark-section-label {
      font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 6px;
    }
    .mark-section p { font-size: .86rem; color: var(--text-2); line-height: 1.65; margin: 0; }
    .mark-kp-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
    .mark-kp-list li { font-size: .84rem; color: var(--text-2); padding-left: 16px; position: relative; line-height: 1.5; }
    .mark-kp-list li::before { content: '›'; position: absolute; left: 0; color: var(--yellow); font-weight: 700; }

    /* Mark lists grid */
    .mark-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .mark-list-col { padding: 14px 18px; }
    .mark-list-col:first-child { border-right: 1px solid var(--border-soft); }
    .mark-list-title { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .mark-list-title.up { color: var(--green); }
    .mark-list-title.down { color: var(--red); }
    .mark-bullet { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .mark-bullet li { font-size: .83rem; color: var(--text-2); padding-left: 18px; position: relative; line-height: 1.5; }
    .mark-bullet.up li::before { content: '✓'; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: .8rem; }
    .mark-bullet.down li::before { content: '!'; position: absolute; left: 2px; color: var(--red); font-weight: 700; font-size: .8rem; }
    .mark-bottom-line {
      padding: 12px 18px; font-size: .84rem; color: var(--text-2);
      font-style: italic; line-height: 1.6;
      border-top: 1px solid var(--border-soft);
      border-left: 3px solid var(--yellow); margin: 0 0 0 -1px;
    }
    @media (max-width: 560px) {
      .mark-lists { grid-template-columns: 1fr; }
      .mark-list-col:first-child { border-right: none; border-bottom: 1px solid var(--border-soft); }
    }

    /* Warren easy body */
    .warren-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .warren-row-label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
    .warren-row p { font-size: .86rem; color: var(--text-2); line-height: 1.65; margin: 0; }
    .warren-metrics {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; background: var(--bg-base);
      border-radius: var(--r); font-size: .82rem;
    }
    .warren-metric { color: var(--text-3); }
    .warren-metric strong { color: var(--text); }

    /* Charlie easy body */
    .charlie-easy-body { padding: 14px 18px; }
    .charlie-verdict-tag {
      display: inline-block; padding: 4px 12px; border-radius: 99px;
      font-size: .78rem; font-weight: 700; margin-bottom: 12px;
    }
    .charlie-verdict-tag.agree { background: var(--green-bg); color: var(--green-text); }
    .charlie-verdict-tag.caution { background: var(--red-bg); color: var(--red-text); }
    .charlie-easy-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
    @media (max-width: 560px) { .charlie-easy-cols { grid-template-columns: 1fr; } }
    .charlie-easy-label { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
    .charlie-easy-label.green { color: var(--green); }
    .charlie-easy-label.red { color: var(--red); }
    .charlie-easy-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
    .charlie-easy-list li { font-size: .82rem; color: var(--text-2); padding-left: 16px; position: relative; line-height: 1.5; }
    .charlie-easy-list.green li::before { content: '✓'; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: .78rem; }
    .charlie-easy-list.red li::before { content: '⚠'; position: absolute; left: 0; color: var(--red); font-size: .78rem; }
    .charlie-easy-summary {
      padding: 10px 14px; background: var(--bg-base); border-radius: var(--r);
      font-size: .84rem; color: var(--text-2); font-style: italic; line-height: 1.6;
    }

    /* Mark Easy section */
    .mark-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); overflow: hidden;
    }
    .mark-card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; background: var(--yellow-dim);
      border-bottom: 1px solid rgba(255, 233, 77,.25);
    }
    .mark-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--yellow); display: flex; align-items: center;
      justify-content: center; font-size: .85rem; font-weight: 800;
      color: #7A5C00; flex-shrink: 0;
    }
    .mark-card-header h4 { font-size: .85rem; font-weight: 700; margin: 0; }
    .mark-card-header .mark-sub { font-size: .75rem; color: var(--text-3); margin-left: auto; }
    .mark-one-liner {
      padding: 18px 20px 14px;
      font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700;
      line-height: 1.45; color: var(--text); border-bottom: 1px solid var(--border-soft);
    }
    .mark-body { padding: 16px 20px; }
    .mark-what { font-size: .88rem; color: var(--text-2); line-height: 1.65; margin-bottom: 16px; }
    .mark-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .mark-lists { grid-template-columns: 1fr; } }
    .mark-list-title { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .mark-list-title.up { color: var(--green); }
    .mark-list-title.down { color: var(--red); }
    .mark-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .mark-list li { font-size: .83rem; color: var(--text-2); line-height: 1.5; padding-left: 18px; position: relative; }
    .mark-list.up li::before { content: '✓'; position: absolute; left: 0; color: var(--green); font-weight: 700; }
    .mark-list.down li::before { content: '!'; position: absolute; left: 2px; color: var(--red); font-weight: 700; }
    .mark-bottom-line {
      margin: 16px 20px 20px; padding: 12px 16px;
      background: var(--bg-base); border-radius: var(--r);
      border-left: 3px solid var(--yellow);
      font-size: .85rem; color: var(--text-2); line-height: 1.6; font-style: italic;
    }
  </style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><span class="logo-dot"></span>oatinvestor</a>
    <div class="nav-links">
      <a href="../index.html">หน้าแรก</a>
      <a href="../portfolio.html">พอร์ตโฟลิโอ</a>
      <a href="stocks.html" class="active">Watchlist</a>
      <a href="trends.html">Trends</a>
      <a href="../team.html">About</a>
    </div>
    <div class="nav-actions">
      <button class="theme-btn" id="theme-btn">🌙</button>
    </div>
  </div>
</nav>

<div class="container-sm" style="padding-top:36px;padding-bottom:80px" id="main-content">
  <a href="stocks.html" class="back-link">← กลับ Watchlist</a>
  <div style="text-align:center;padding:48px 0;color:var(--text-3)">กำลังโหลด...</div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">oatinvestor</div>
    <div class="footer-links">
      <a href="stocks.html">← Watchlist</a>
      <a href="../portfolio.html">พอร์ตโฟลิโอ</a>
    </div>
  </div>
  <div class="footer-copy">© 2026 oatinvestor · ข้อมูลเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน</div>
</footer>

<script src="../app.js"></script>
<script>
function renderStock(s) {
  const ticker = s.symbol || s.display || '—';
  const mos = s.mos;
  const mosClass = mos == null ? '' : mos >= 15 ? 'pos' : mos < 0 ? 'neg' : 'warn';
  const mosText = mos == null ? '—' : (mos >= 0 ? '+' : '') + mos.toFixed(1) + '%';

  // Story Gate
  const sg = s.story_gate || {};
  const sgPass = sg.passed === true || sg.status === 'PASS';
  const storyGateHTML = sg.what ? `
    <div class="story-gate ${sgPass ? 'pass' : 'fail'}">
      <div class="story-gate-header">
        <div class="story-gate-icon">${sgPass ? '✅' : '❌'}</div>
        <h4>Story Gate — ${sgPass ? 'PASS' : 'FAIL'}</h4>
        ${sg.tier ? tierBadge(sg.tier) : ''}
      </div>
      <div class="story-gate-body">
        ${sg.what ? `<div class="story-gate-row"><span class="story-gate-key">WHAT</span><span class="story-gate-val">${sg.what}</span></div>` : ''}
        ${sg.why ? `<div class="story-gate-row"><span class="story-gate-key">WHY</span><span class="story-gate-val">${sg.why}</span></div>` : ''}
        ${sg.risk ? `<div class="story-gate-row"><span class="story-gate-key">RISK</span><span class="story-gate-val">${sg.risk}</span></div>` : ''}
      </div>
    </div>` : '';

  // Charlie verdict
  const ch = s.charlie || {};
  const cv = (ch.charlie_verdict || ch.verdict || '').toUpperCase();
  const chClass = cv.includes('AGREE') ? 'agree' : cv.includes('CONCERN') ? 'concern' : cv.includes('CAUTION') ? 'caution' : 'caution';
  const chIcon = cv.includes('AGREE') ? '✅' : cv.includes('CONCERN') ? '⚠️' : '🔍';
  const charlieHTML = cv ? `
    <div class="charlie-card ${chClass}">
      <div class="charlie-header">
        <span style="font-size:1.1rem">${chIcon}</span>
        <h4>Charlie — ${cv}</h4>
      </div>
      <div class="charlie-body">
        ${(ch.verified_claims||[]).length ? '<div style="margin-bottom:8px"><strong>✓ Verified:</strong><ul style="margin:4px 0 0 16px;list-style:disc">' + ch.verified_claims.slice(0,3).map(c=>`<li style="margin-bottom:4px">${c}</li>`).join('') + '</ul></div>' : ''}
        ${(ch.concerns||[]).length ? '<div><strong>⚠ Concerns:</strong><ul style="margin:4px 0 0 16px;list-style:disc">' + ch.concerns.slice(0,3).map(c=>`<li style="margin-bottom:4px">${c}</li>`).join('') + '</ul></div>' : ''}
      </div>
    </div>` : '';

  // ── Mark card (full) ─────────────────────────────────────
  const me = s.mark_easy || {};
  const mf = s.mark_full || null;
  const markHTML = (mf || me.one_liner) ? `
    <div class="analyst-card mark-card">
      <div class="analyst-header">
        <img src="../images/team/mark.png" class="analyst-avatar" style="object-fit:cover;object-position:top">
        <h4>Mark — นักวิจัย</h4>
        <span class="analyst-role">สรุปอ่านง่าย · ภาษาไทย</span>
      </div>
      ${me.one_liner ? `<div style="padding:14px 18px 10px;font-family:var(--font-serif);font-size:1.05rem;font-weight:700;line-height:1.45;border-bottom:1px solid var(--border-soft)">${me.one_liner}</div>` : ''}
      ${mf ? `
      <div class="mark-section"><div class="mark-section-label">บริษัทนี้ทำอะไร</div><p>${mf.business_overview}</p></div>
      <div class="mark-section"><div class="mark-section-label">ขนาดตลาด (TAM)</div><p>${mf.tam}</p></div>
      <div class="mark-section"><div class="mark-section-label">ข้อได้เปรียบที่ยั่งยืน (MOAT)</div><p>${mf.moat}</p></div>
      <div class="mark-section"><div class="mark-section-label">ผลประกอบการล่าสุด</div><p>${mf.latest_financials}</p></div>
      <div class="mark-section">
        <div class="mark-section-label">จุดสำคัญที่ต้องรู้</div>
        <ul class="mark-kp-list">${(mf.key_points||[]).map(k=>`<li>${k}</li>`).join('')}</ul>
      </div>` : ''}
      ${(me.why_invest||[]).length || (me.watch_out||[]).length ? `
      <div class="mark-lists">
        <div class="mark-list-col">
          <div class="mark-list-title up">ทำไมน่าลงทุน</div>
          <ul class="mark-bullet up">${(me.why_invest||[]).map(w=>`<li>${w}</li>`).join('')}</ul>
        </div>
        <div class="mark-list-col">
          <div class="mark-list-title down">ต้องระวัง</div>
          <ul class="mark-bullet down">${(me.watch_out||[]).map(w=>`<li>${w}</li>`).join('')}</ul>
        </div>
      </div>` : ''}
      ${me.bottom_line ? `<div class="mark-bottom-line">${me.bottom_line}</div>` : ''}
    </div>` : '';

  // ── Warren Easy card (narrative paragraphs) ──────────────
  const we = s.warren_easy || null;
  // support both old {thesis,...} and new [paragraph, ...] formats
  const warrenParas = Array.isArray(we) ? we : (we ? [we.thesis, we.why_now, we.valuation_context, we.strategy].filter(Boolean) : []);
  const warrenHTML = warrenParas.length ? `
    <div class="analyst-card warren-card">
      <div class="analyst-header">
        <img src="../images/team/warren.png" class="analyst-avatar" style="object-fit:cover;object-position:top">
        <h4>Warren — Portfolio Manager</h4>
        <span class="analyst-role">มุมมองการลงทุน · ภาษาไทย</span>
      </div>
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">
        ${warrenParas.map(p => `<p style="font-size:.87rem;color:var(--text-2);line-height:1.7;margin:0">${p}</p>`).join('')}
      </div>
    </div>` : '';

  // ── Charlie Easy card (narrative paragraphs) ──────────────
  const ce = s.charlie_easy || null;
  const ceVerdict = ce ? (ce.verdict||'AGREE').toUpperCase() : '';
  const ceClass = ceVerdict.includes('AGREE') ? 'agree' : 'caution';
  const ceParas = ce ? (ce.paragraphs || [ce.summary].filter(Boolean)) : [];
  const charlieEasyHTML = ce ? `
    <div class="analyst-card charlie-easy-card">
      <div class="analyst-header">
        <img src="../images/team/charlie.png" class="analyst-avatar" style="object-fit:cover;object-position:top">
        <h4>Charlie — Risk Reviewer</h4>
        <span class="analyst-role">ตรวจสอบอิสระ · ภาษาไทย</span>
      </div>
      <div style="padding:14px 18px">
        <span class="charlie-verdict-tag ${ceClass}" style="margin-bottom:12px;display:inline-block">${ceVerdict}</span>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${ceParas.map(p => `<p style="font-size:.87rem;color:var(--text-2);line-height:1.7;margin:0">${p}</p>`).join('')}
        </div>
      </div>
    </div>` : '';

  // Bull / Risk
  const bull = (s.bull||[]).slice(0,5);
  const risk = (s.risk||[]).slice(0,5);

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <a href="stocks.html" class="back-link">← กลับ Watchlist</a>

    <!-- Stock Header -->
    <div class="stock-header">
      <div class="stock-header-left">
        <div class="company-name">${s.name || ''}</div>
        <h1>${ticker}</h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          ${actionBadge(s.action||'study')}
          ${convictionBadge(s.conviction||'')}
          ${tierBadge(s.tier||s.wafBadge||'')}
          ${(s.chips||[]).slice(0,2).map(c=>`<span class="badge badge-blue" style="font-size:.72rem">${c}</span>`).join('')}
        </div>
        ${(s.trend_tags||[]).length ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          <span style="font-size:.72rem;color:var(--text-3);align-self:center">Trends:</span>
          ${(s.trend_tags||[]).map(tag=>`<a href="trends.html#${tag}" class="trend-tag-link" style="font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-2);text-decoration:none;transition:all var(--ease)" onmouseover="this.style.borderColor='var(--yellow)';this.style.color='var(--yellow-text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-2)'">${tag}</a>`).join('')}
        </div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="price-big">${fmtPrice(s.price)}</div>
        <div style="font-size:.78rem;color:var(--text-3);margin-top:4px">ราคาปัจจุบัน</div>
      </div>
    </div>

    <!-- Mark — Research Layer -->
    ${markHTML ? `
    <div class="section-block">
      <div class="section-block-title">วิเคราะห์จาก Mark</div>
      ${markHTML}
    </div>` : ''}

    <!-- Warren Easy — Investment Thesis in Thai -->
    ${warrenHTML ? `
    <div class="section-block">
      <div class="section-block-title">มุมมองจาก Warren</div>
      ${warrenHTML}
    </div>` : ''}

    <!-- Valuation Panel -->
    ${s.fv ? `
    <div class="section-block">
      <div class="section-block-title">Valuation</div>
      <div class="val-panel">
        <div class="val-grid">
          <div><div class="val-item-label">Fair Value</div><div class="val-item-value">${fmtPrice(s.fv)}</div></div>
          <div><div class="val-item-label">Margin of Safety</div><div class="val-item-value ${mosClass}" style="font-size:1.1rem">${mosText}</div></div>
          <div><div class="val-item-label">WAF Score</div><div>${wafBar(s.waf)}</div></div>
          ${s.fpe != null ? `<div><div class="val-item-label">Fwd P/E</div><div class="val-item-value" style="font-size:1.1rem">${s.fpe.toFixed(1)}x</div></div>` : ''}
          ${s.peg != null ? `<div><div class="val-item-label">PEG</div><div class="val-item-value" style="font-size:1.1rem">${s.peg.toFixed(2)}</div></div>` : ''}
          ${s.updated ? `<div><div class="val-item-label">อัพเดท</div><div style="font-size:.85rem;padding-top:6px;color:var(--text-2)">${s.updated}</div></div>` : ''}
        </div>
      </div>
    </div>` : ''}

    <!-- Investment Idea -->
    ${(s.idea_th || s.idea) ? `
    <div class="section-block">
      <div class="section-block-title">Investment Idea</div>
      <div class="idea-box"><p>"${s.idea_th || s.idea}"</p></div>
    </div>` : ''}

    <!-- Story Gate -->
    ${(s.story_gate_th || storyGateHTML) ? (() => {
      const sgt = s.story_gate_th;
      if (sgt) {
        const sg = s.story_gate || {};
        const sgPass = sg.passed === true || sg.status === 'PASS';
        return `
        <div class="section-block">
          <div class="section-block-title">Story Gate — ${sgPass ? '<span class="pos">PASS ✓</span>' : '<span class="neg">FAIL ✗</span>'}</div>
          <div class="story-gate ${sgPass ? 'pass' : 'fail'}">
            <div class="story-gate-body">
              ${sgt.what ? `<div class="story-gate-row"><span class="story-gate-key">WHAT</span><span class="story-gate-val">${sgt.what}</span></div>` : ''}
              ${sgt.why  ? `<div class="story-gate-row"><span class="story-gate-key">WHY NOW</span><span class="story-gate-val">${sgt.why}</span></div>` : ''}
              ${sgt.risk ? `<div class="story-gate-row"><span class="story-gate-key">IF WRONG</span><span class="story-gate-val">${sgt.risk}</span></div>` : ''}
            </div>
          </div>
        </div>`;
      }
      return `<div class="section-block"><div class="section-block-title">Story Gate</div>${storyGateHTML}</div>`;
    })() : ''}

    <!-- Bull & Risk -->
    ${(() => {
      const bullArr = (s.bull_th || s.bull || []).slice(0,5);
      const riskArr = (s.risk_th || s.risk || []).slice(0,5);
      if (!bullArr.length && !riskArr.length) return '';
      return `
      <div class="section-block">
        <div class="section-block-title">Bull Case / Risk</div>
        <div class="bull-risk-grid">
          <div>
            <div style="font-size:.78rem;font-weight:700;color:var(--green);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">▲ โอกาส</div>
            <ul class="bull-list">${bullArr.map(b=>`<li><span>${b}</span></li>`).join('')}</ul>
          </div>
          <div>
            <div style="font-size:.78rem;font-weight:700;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">▼ ความเสี่ยง</div>
            <ul class="risk-list">${riskArr.map(r=>`<li><span>${r}</span></li>`).join('')}</ul>
          </div>
        </div>
      </div>`;
    })()}

    <!-- Charlie — Thai narrative (hide raw when available) -->
    ${charlieEasyHTML ? `
    <div class="section-block">
      <div class="section-block-title">ตรวจสอบโดย Charlie</div>
      ${charlieEasyHTML}
    </div>` : charlieHTML ? `
    <div class="section-block">
      <div class="section-block-title">Charlie Verdict</div>
      ${charlieHTML}
    </div>` : ''}

    <!-- Disclaimer -->
    <div style="margin-top:32px;padding:14px 18px;background:var(--bg-surface);border-radius:var(--r);border:1px solid var(--border)">
      <p style="font-size:.78rem;color:var(--text-3)">⚠️ ข้อมูลเพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน</p>
    </div>
  `;
}

// Load from URL param
const params = new URLSearchParams(location.search);
const ticker = (params.get('t') || '').toUpperCase();

if (!ticker) {
  location.href = 'stocks.html';
} else {
  fetch('../data/stocks.json').then(r => r.json()).then(data => {
    const s = data[ticker];
    if (!s) {
      document.getElementById('main-content').innerHTML =
        `<a href="stocks.html" class="back-link">← กลับ Watchlist</a>
         <div style="text-align:center;padding:64px 0">
           <h2>ไม่พบหุ้น "${ticker}"</h2>
           <a href="stocks.html" class="btn btn-secondary" style="margin-top:16px">กลับ Watchlist</a>
         </div>`;
      return;
    }
    document.title = `${ticker} — oatinvestor`;
    renderStock(s);
  }).catch(() => {
    document.getElementById('main-content').innerHTML =
      `<a href="stocks.html" class="back-link">← กลับ Watchlist</a>
       <div style="text-align:center;padding:64px 0;color:var(--text-3)">โหลดข้อมูลไม่ได้ — ลองรันผ่าน local server</div>`;
  });
}
</script>
</body>
</html>
